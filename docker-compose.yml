version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: pickme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickme
      POSTGRES_USER: pickme
      POSTGRES_PASSWORD: pickme
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pickme_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://pickme:pickme@postgres:5432/pickme?schema=public
    depends_on:
      - postgres
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pickme_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  postgres_data:
